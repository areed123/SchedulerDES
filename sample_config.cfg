# SchedulerDES Sample Configuration
# Uncomment and modify parameters as needed

# Number of processes to simulate (1-1000000)
processCount=500

# Arrival rate in processes per time unit (0.01-1000.0)
arrivalRate=5.0

# Average service time per process (0.001-100.0)
serviceTime=0.2

# Number of CPU cores (1-256)
coreCount=2

# Scheduling algorithm (FCFS, etc.)
algorithmName=FCFS
